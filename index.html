<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heiner Hofmann | Kitesurf</title>
<meta name="description" content="Aulas presenciais, curso avançado, clínica e equipamentos de kitesurf com Heiner Hofmann.">
<meta name="theme-color" content="#0a0a0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0a; --surface:#131313; --line:#232323;
    --text:#f2f2f2; --muted:#8a8a8a; --accent:#ff6a1a; --accent2:#e3122d; --grad:linear-gradient(90deg,var(--accent),var(--accent2));
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;font-family:"Inter",system-ui,sans-serif;color:var(--text);background:var(--bg);
    display:flex;justify-content:center;padding:0 16px calc(32px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent;position:relative;overflow-x:hidden;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(500px 320px at 50% -10%,rgba(255,90,30,.14),transparent 70%);
  }
  main{width:100%;max-width:380px;display:flex;flex-direction:column;gap:9px;position:relative}
  .display{font-family:"Barlow Condensed",sans-serif;font-weight:500;text-transform:uppercase;letter-spacing:1.5px}

  header{text-align:center;margin-bottom:14px;position:relative}
  .cover{margin:0 -16px;height:150px;position:relative;overflow:hidden;border-radius:0 0 18px 18px}
  .cover img{width:100%;height:100%;object-fit:cover;object-position:center 62%;display:block}
  .cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,10,10,.1) 30%,var(--bg))}
  .avatar{
    width:72px;height:72px;border-radius:50%;object-fit:cover;object-position:center 20%;
    border:2px solid transparent;padding:2px;margin-top:-42px;position:relative;
    background:linear-gradient(var(--surface),var(--surface)) padding-box,var(--grad) border-box;
  }
  .logo{width:62%;max-width:230px;display:block;margin:12px auto 0}
  .bio{color:var(--muted);margin-top:7px;font-size:12px;letter-spacing:.3px}

  a.card{
    display:block;text-decoration:none;color:inherit;background:var(--surface);
    border:1px solid var(--line);border-radius:12px;overflow:hidden;
    transition:border-color .2s ease,transform .2s ease;
  }
  a.card:hover{border-color:var(--accent);transform:translateY(-2px)}

  .feature .media{aspect-ratio:2.3/1;position:relative;overflow:hidden}
  .feature .media>img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease}
  a.feature:hover .media>img{transform:scale(1.04)}
  .tag{
    position:absolute;top:9px;right:9px;z-index:2;background:var(--grad);color:#fff;
    font:600 9px "Inter",sans-serif;text-transform:uppercase;letter-spacing:1.2px;padding:4px 8px;border-radius:3px
  }
  .feature .foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px}
  .feature .foot strong{font-size:18px;line-height:1}
  .cta{font:600 10px "Inter",sans-serif;color:var(--accent);text-transform:uppercase;letter-spacing:1.2px;white-space:nowrap}

  /* capa do curso, montada em código */
  .course{background:#0d0d0d;isolation:isolate}
  .course .photo{position:absolute;right:0;top:0;width:50%;height:100%;object-fit:cover;object-position:60% 18%;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 45%);mask-image:linear-gradient(90deg,transparent,#000 45%)}
  .course::before{content:"";position:absolute;inset:0;z-index:-1;
    background:radial-gradient(120% 140% at 0% 100%,rgba(227,18,45,.35),transparent 55%),radial-gradient(90% 120% at 10% 0%,rgba(255,106,26,.22),transparent 60%)}
  .course .copy{position:absolute;left:14px;top:50%;transform:translateY(-50%);z-index:1}
  .course .eyebrow{font:600 9px "Inter",sans-serif;letter-spacing:2px;text-transform:uppercase;color:var(--accent)}
  .course .name{font-family:"Barlow Condensed",sans-serif;font-weight:400;font-size:25px;line-height:.95;text-transform:uppercase;letter-spacing:1px;margin-top:4px}
  .course .name b{font-weight:600;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .course .bar{width:28px;height:2px;background:var(--grad);margin-top:9px}

  .row{display:flex;align-items:center;gap:11px;padding:0 14px;min-height:46px}
  .row svg{width:17px;height:17px;flex:none;color:var(--accent)}
  .row span{flex:1;font-size:16px;line-height:1}
  .row .arrow{color:var(--muted);font-size:14px;font-weight:400;transition:transform .2s ease,color .2s ease}
  a.card:hover .arrow{color:var(--accent);transform:translateX(3px)}
  .academy{background:#0d0d0d}
  .academy .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 35%;filter:grayscale(1) brightness(.35)}
  .academy::after{content:"";position:absolute;inset:0;background:radial-gradient(90% 120% at 50% 120%,rgba(227,18,45,.35),transparent 60%),radial-gradient(70% 90% at 50% -20%,rgba(255,106,26,.25),transparent 60%)}
  .feature .academy>img.mark{height:auto;object-fit:contain;transition:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:58%;z-index:1}

  .section-label{color:var(--muted);font:600 9px "Inter",sans-serif;text-transform:uppercase;letter-spacing:2px;margin:10px 2px 0}
  @media (min-width:600px){
    body{padding-top:28px}
    .cover{margin:0;border-radius:18px;height:180px}
  }
  footer{text-align:center;color:#4a4a4a;font-size:10px;margin-top:18px;letter-spacing:.5px}
</style>
</head>
<body>
<main>
  <header>
    <div class="cover"><img src="assets/salto.jpg" alt=""></div>
    <img class="avatar" src="assets/perfil.jpg" alt="Heiner Hofmann">
    <h1><img class="logo" src="assets/logo.png" alt="Heiner Hofmann"></h1>
    <p class="bio">Instrutor de kitesurf · aulas, cursos e equipamentos</p>
  </header>

  <a class="card feature" href="https://wa.me/5551995464701?text=Oi%20Heiner!%20Quero%20agendar%20uma%20aula%20presencial%20de%20kitesurf." target="_blank" rel="noopener">
    <div class="media">
      <span class="tag">Presencial</span>
      <img src="assets/aula.webp" alt="Aula presencial de kitesurf na praia" style="object-position:center 40%">
    </div>
    <div class="foot"><strong class="display">Agende sua aula</strong><span class="cta">Agendar →</span></div>
  </a>

  <a class="card feature" href="https://kiteacademy.com.br/" target="_blank" rel="noopener">
    <div class="media course">
      <span class="tag">Online</span>
      <img class="photo" src="assets/perfil.jpg" alt="Heiner Hofmann">
      <div class="copy">
        <div class="eyebrow">Curso online</div>
        <div class="name">Avançado de<br><b>Kitesurf</b></div>
        <div class="bar"></div>
      </div>
    </div>
    <div class="foot"><strong class="display">Curso Avançado</strong><span class="cta">Ver curso →</span></div>
  </a>

  <a class="card feature" href="https://www.kiteacademy.com.br/" target="_blank" rel="noopener">
    <div class="media academy">
      <span class="tag">Escola</span>
      <img class="bg" src="assets/salto.jpg" alt="">
      <img class="mark" src="assets/logo-academy.png" alt="Heiner Hofmann Kite Academy">
    </div>
    <div class="foot"><strong class="display">Kite Academy</strong><span class="cta">Conhecer →</span></div>
  </a>

  <p class="section-label">Mais</p>

  <a class="card" href="https://tr.ee/eCxXAU8B0Y" target="_blank" rel="noopener">
    <div class="row">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 2 4 10l8 4 8-4z"/><path d="M12 14v8"/></svg>
      <span class="display">Clínica de Kitesurf</span><b class="arrow">→</b>
    </div>
  </a>

  <a class="card" href="https://wa.me/5551995464701?text=Oi%20Heiner!%20Quero%20saber%20sobre%20equipamentos." target="_blank" rel="noopener">
    <div class="row">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 6h15l-2 9H8z"/><path d="M6 6 5 3H2"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/></svg>
      <span class="display">Equipamentos</span><b class="arrow">→</b>
    </div>
  </a>

  <a class="card" href="https://youtube.com/@heinerhofmannkite" target="_blank" rel="noopener">
    <div class="row">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="5" width="20" height="14" rx="4"/><path d="m10 9 5 3-5 3z" fill="currentColor"/></svg>
      <span class="display">YouTube</span><b class="arrow">→</b>
    </div>
  </a>

  <a class="card" href="https://www.tiktok.com/@heinerhofmannkite" target="_blank" rel="noopener">
    <div class="row">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M14 3v11a4 4 0 1 1-4-4"/><path d="M14 3c.5 3 2.5 5 6 5"/></svg>
      <span class="display">TikTok</span><b class="arrow">→</b>
    </div>
  </a>

  <footer>© Heiner Hofmann Kite Academy</footer>
</main>
</body>
</html>
