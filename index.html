<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heiner Hofmann | Kitesurf</title>
<meta name="description" content="Aulas presenciais, curso avançado, clínica e equipamentos de kitesurf com Heiner Hofmann.">
<meta name="theme-color" content="#0a0a0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,800;1,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0a; --surface:#141414; --line:#262626;
    --text:#f5f5f5; --muted:#8a8a8a; --accent:#ff6a1a; --accent2:#e3122d; --grad:linear-gradient(90deg,var(--accent),var(--accent2));
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;font-family:"Inter",system-ui,sans-serif;color:var(--text);background:var(--bg);
    display:flex;justify-content:center;padding:40px 16px 56px;position:relative;overflow-x:hidden;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(600px 400px at 50% -10%,rgba(255,90,30,.16),transparent 70%);
  }
  main{width:100%;max-width:520px;display:flex;flex-direction:column;gap:12px;position:relative}
  .display{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-style:italic;text-transform:uppercase;letter-spacing:.5px}

  header{text-align:center;margin-bottom:20px;position:relative}
  .cover{margin:-40px -16px 0;height:220px;position:relative;overflow:hidden;border-radius:0 0 24px 24px}
  .cover img{width:100%;height:100%;object-fit:cover;object-position:center 30%;display:block}
  .cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,10,10,.1) 30%,var(--bg))}
  .logo{width:78%;max-width:340px;display:block;margin:0 auto}
  .avatar{
    width:104px;height:104px;border-radius:50%;object-fit:cover;background:var(--surface);
    border:3px solid transparent;padding:3px;margin-top:-56px;position:relative;object-position:center 20%;background:linear-gradient(var(--surface),var(--surface)) padding-box,var(--grad) border-box;
  }
  h1{margin-top:18px}
  h1 em{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-style:inherit;padding-right:4px}
  .bio{color:var(--muted);margin-top:8px;font-size:14px;letter-spacing:.3px}

  a.card{
    display:block;text-decoration:none;color:inherit;background:var(--surface);
    border:1px solid var(--line);border-radius:14px;overflow:hidden;
    transition:border-color .2s ease,transform .2s ease;
  }
  a.card:hover{border-color:var(--accent);transform:translateY(-2px)}

  .feature .media{aspect-ratio:16/9;position:relative;overflow:hidden}
  .feature img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease}
  a.feature:hover img{transform:scale(1.04)}
  .feature .media::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.85))}
  .feature .title{position:absolute;left:18px;right:18px;bottom:14px;z-index:1;font-size:30px;line-height:.95}
  .tag{
    position:absolute;top:14px;left:14px;z-index:1;background:var(--grad);color:#fff;
    font:700 11px "Inter",sans-serif;text-transform:uppercase;letter-spacing:1.2px;padding:5px 10px;border-radius:4px
  }
  .feature .foot{display:flex;align-items:center;justify-content:space-between;padding:14px 18px}
  .feature .foot small{color:var(--muted);font-size:13px}
  .cta{font:600 13px "Inter",sans-serif;color:var(--accent);text-transform:uppercase;letter-spacing:1px}

  .placeholder{
    width:100%;height:100%;display:block;
    background:
      repeating-linear-gradient(135deg,rgba(255,90,30,.08) 0 2px,transparent 2px 22px),
      linear-gradient(160deg,#2a1610,#0a0a0a);
  }

  .row{display:flex;align-items:center;gap:14px;padding:16px 18px}
  .row svg{width:22px;height:22px;flex:none;color:var(--accent)}
  .row span{flex:1;font-size:22px;line-height:1}
  .row .arrow{color:var(--muted);font-size:18px;transition:transform .2s ease,color .2s ease}
  a.card:hover .arrow{color:var(--accent);transform:translateX(4px)}

  .section-label{color:var(--muted);font:600 11px "Inter",sans-serif;text-transform:uppercase;letter-spacing:2px;margin:12px 2px 0}
  footer{text-align:center;color:#555;font-size:12px;margin-top:24px;letter-spacing:.5px}
</style>
</head>
<body>
<main>
  <header>
    <div class="cover"><img src="assets/salto.jpg" alt=""></div>
    <img class="avatar" src="assets/perfil.jpg" alt="Heiner Hofmann">
    <h1><img class="logo" src="assets/logo-academy.png" alt="Heiner Hofmann Kite Academy"></h1>
    <p class="bio">Instrutor de kitesurf · aulas, cursos e equipamentos</p>
  </header>

  <a class="card feature" href="https://wa.me/5551995464701?text=Oi%20Heiner!%20Quero%20agendar%20uma%20aula%20presencial%20de%20kitesurf." target="_blank" rel="noopener">
    <div class="media">
      <span class="tag">Presencial</span>
      <img src="assets/aula.webp" alt="" onerror="this.outerHTML='<span class=placeholder></span>'">
      <div class="title display">Agende sua aula</div>
    </div>
    <div class="foot"><small>Direto comigo no WhatsApp</small><span class="cta">Agendar →</span></div>
  </a>

  <a class="card feature" href="https://kiteacademy.com.br/" target="_blank" rel="noopener">
    <div class="media">
      <span class="tag">Online</span>
      <img src="https://ugc.production.linktr.ee/0ebb0938-a5f0-4a6d-883f-8755bfa72a46_CAPA-CURSO-HEINER-7ccf617c2ff8487cad6fad6dcb5bc24f-4c6e4a6aea4d467aabd31d1418a9bb65.png?io=true&size=thumbnail-feature-v1_0" alt="Curso Avançado de Kitesurf">
    </div>
    <div class="foot"><small>Curso Avançado de Kitesurf</small><span class="cta">Ver curso →</span></div>
  </a>

  <p class="section-label">Mais</p>

  <a class="card" href="https://tr.ee/eCxXAU8B0Y" target="_blank" rel="noopener">
    <div class="row">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 4 10l8 4 8-4z"/><path d="M12 14v8"/></svg>
      <span class="display">Clínica de Kitesurf</span><b class="arrow">→</b>
    </div>
  </a>

  <a class="card" href="https://wa.me/5551995464701?text=Oi%20Heiner!%20Quero%20saber%20sobre%20equipamentos." target="_blank" rel="noopener">
    <div class="row">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6h15l-2 9H8z"/><path d="M6 6 5 3H2"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/></svg>
      <span class="display">Equipamentos</span><b class="arrow">→</b>
    </div>
  </a>

  <a class="card" href="https://youtube.com/@heinerhofmannkite" target="_blank" rel="noopener">
    <div class="row">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="4"/><path d="m10 9 5 3-5 3z" fill="currentColor"/></svg>
      <span class="display">YouTube</span><b class="arrow">→</b>
    </div>
  </a>

  <a class="card" href="https://www.tiktok.com/@heinerhofmannkite" target="_blank" rel="noopener">
    <div class="row">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3v11a4 4 0 1 1-4-4"/><path d="M14 3c.5 3 2.5 5 6 5"/></svg>
      <span class="display">TikTok</span><b class="arrow">→</b>
    </div>
  </a>

  <footer>© Heiner Hofmann Kite Academy</footer>
</main>
</body>
</html>
